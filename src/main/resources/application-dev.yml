# Development profile - Overrides for local development environment

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

#Logging for development
logging:
  level:
    root: INFO
    com.orientation.backend: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari: DEBUG

management:
  endpoints:
    health:
      show-details: always