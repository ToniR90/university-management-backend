spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/students_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 60000
      max-lifetime: 600000
      connection-timeout: 20000
      leak-detection-threshold: 0

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none  # Flyway handles schema

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    root: WARN
    com.orientation.backend: INFO
    org.springframework: WARN
    org.hibernate: WARN

management:
  endpoint:
    health:
      show-details: never